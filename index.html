и сообщений\n-Практический опыт работы с Docker\n-Понимание принципов построения надёжных и поддерживаемых backend-сервисов\n-Опыт написания unit- и интеграционных тестов\n-Умение самостоятельно погружаться в предметную область, уточнять требования и предлагать решения\n-Опыт работы в распределённых продуктовых или проектных командах\n-Будет плюсом:\n-Опыт работы в HealthTech, лабораторной диагностике или медицинских информационных системах\n-Опыт в eCommerce, Retail, маркетплейсах, логистике или платёжных интеграциях\n-Опыт в промышленности, металлургии, производственных и учётных системах\n-Практика профилирования сервисов и оптимизации производительности\n-Опыт работы с Kafka, Redis, MongoDB или ClickHouse\n-Знание Kubernetes и опыт настройки CI/CD в GitLab CI/CD, GitHub Actions или Jenkins\n-Опыт разработки микросервисных и событийных систем\n-Опыт интеграции.NET-приложений с ML- или AI-сервисами\n\nКонтакты: job@crtweb.ru / Telegram @crtdev\n\n🔥 Подписаться на наши каналы / @best_itjob / @it_rab", "entities": [{"type": "url", "offset": 260, "length": 7}, {"type": "url", "offset": 433, "length": 6}, {"type": "url", "offset": 1019, "length": 5}, {"type": "url", "offset": 1093, "length": 7}, {"type": "url", "offset": 1147, "length": 11}, {"type": "url", "offset": 1181, "length": 16}, {"type": "text_url", "offset": 2367, "length": 26, "url": "https://t.me/addlist/8QASR3uThEI2ZjVi"}, {"type": "text_url", "offset": 2396, "length": 11, "url": "https://t.me/best_itjob"}, {"type": "text_url", "offset": 2410, "length": 7, "url": "https://t.me/it_rab"}], "link": "https://t.me/back_rabota/1830", "regex_matched": true, "is_vacancy": true, "title": "CRT", "company": null, "location": "удалённо", "grade": "Lead", "python": false, "django": false, "fastapi": false, "flask": false, "php": false, "java": false, "go": false, "node": false, "dotnet": true, "ruby": false, "rust": false, "sql": true, "nosql": false, "kafka": true, "docker": false, "microservices": false, "grpc": fal , но нужен человек, который проверяет за моделью и понимает каждую строку, которую коммитит.\nПлюсом: понимание VPN/Proxy, базовая ИБ-грамотность.\n\n❌ Не подойдёт: студентам очной формы; тем, кому нужен ментор и жёсткое ревью, чтобы расти; тем, кто отдаёт задачу агенту и присылает результат не читая.\n\n💼 R&D и рост в перспективе: погружение в наши сервисы анализа сетевых протоколов, участие в исследованиях и разработке новых методов детекции в сфере anti-fraud.\n\n \n🤝 Формат: удалёнка, фултайм, самозанятость, РФ или РБ\n\n▪️Зарплата от 70-170 тыс. руб. на руки (возможны выплаты в USDT).\n▪️Задачка на интерес: клиент резолвит имя через Cloudflare DNS, а ответ приходит с адреса Google. Если интересно, почему так, — вам к нам.\n▪️Анкета: [Заполнить анкету]\n\n#вакансия #Go #Golang #backend #remote #работа #job #vacancy #разработчик #fulltime #удаленка", "entities": [{"type": "text_url", "offset": 2096, "length": 18, "url": "https://docs.google.com/forms/d/e/1FAIpQLSe5W392c7iFIrc2euAwaSAu5GciTL6eGllyrOqDcWPMKUrBkg/viewform?usp=pp_url&entry.99068136=fordev"}], "link": "https://t.me/fordev/57395", "regex_matched": true, "is_vacancy": true, "title": "Go Backend Developer (Сети, DevOps, Security)", "company": null, "location": "Remote", "grade": null, "python": false, "django": false, "fastapi": false, "flask": false, "php": false, "java": false, "go": true, "node": false, "dotnet": false, "ruby": false, "rust": false, "sql": false, "nosql": false, "kafka": false, "docker": false, "microservices": false, "grpc": false, "rest": false, "ml_ai": false, "remote": true, "salary": "170 тыс", "short_description": "Мы — технологический стартап, делаем детекцию прокси и VPN по сетевым отпечаткам и DNS-скоринг для антифрода (Не РКН). Разработка своя, продукт продаётся, есть клиенты. Название и сайт покажем на первом созвоне — не хотим, чтобы конкуренты читали нашу вакансию раньше кандидатов.", "duplicates": [], "is_new": false, "is_archived": false}, {"channel_id": 1305766523, "ch
