 both employees and partners.\n\nWe are currently seeking an Infrastructure Engineer [Trading / ML Infrastructure] to join our team.\n\nWhat you’ll do:\n\nYou’ll take end-to-end ownership of our trading infrastructure:\n\n- Build, maintain, and optimize server and network infrastructure;\n- Configure and maintain VPNs, private networks, routing, firewalls, and secure connectivity between infrastructure components;\n- Manage infrastructure across AWS, Hetzner, and dedicated/bare-metal environments;\n- Automate provisioning and configuration;\n- Improve infrastructure reliability, performance, fault tolerance, and security;\n- Optimize systems for performance-sensitive trading workloads;\n- Build and improve monitoring, observability, and alerting;\n- Evaluate new technologies, providers, hardware, and architectural approaches;\n- Work closely with developers and the trading team to understand where infrastructure can improve the performance of the overall trading stack.\n\nWhat we're looking for:\n\n- Hands-on experience setting up Kubernetes on bare metal (Hetzner, private DCs, or similar) — not just managed clusters like EKS/GKE\n- Solid command of Prometheus, Grafana, and a logging stack (Loki / ELK / equivalent)\n- Production experience with both Ansible and Terraform\n- CI/CD pipeline design for container images (GitLab CI / GitHub Actions / ArgoCD / similar)\n- Understanding of ML infrastructure specifics: GPU nodes, job queues, large datasets, long-running jobs\n- Ability to read and assess legacy infrastructure code and make pragmatic decisions about what to reuse vs. rewrite\n- Independence — this is a sole-infrastructure role on the project\n\nNice to have (bonus scope):\n\n- Experience with **trading/HFT infrastructure, low-latency systems, advanced networking, bare-metal optimization, or high-performance computing would be a strong advantage.\n- VPN setup, network policies, secrets management (Vault)\n- Familiarity with ML tools\n\nWhat we offer:\n\n- Office-based work in Limassol, Cyprus, working closely with the core team;\n- Full ownership of the infrastructure — you’ll have the freedom to shape, improve, and rethink the systems you work with;\n- Real engineering freedom — propose new tools, providers, hardware, network setups, automation, or architectural changes if you believe there’s a better way;\n- Challenging trading infrastructure — work with performance-sensitive systems, dedicated servers, networking, and infrastructure where speed, reliability, and efficiency actually matter;\n- Direct impact — infrastructure improvements can directly affect the performance and reliability of our trading systems;\n- Competitive compensation, based on your experience and technical level.\n\nHow to apply: \n\nIn your application, briefly cover:\n\nYour experience with bare-metal Kubernetes — what clusters you've built, what size, what workloads\n\nIf you have any additional questions or need clarifications, feel free to reach out to us directly:\n\n- Telegram: @aipTech_hr\n- E-mail: hr@aip.tech\n\nWe’re happy to help and look forward to learning more about your experience.", "entities": [{"type": "url", "offset": 93, "length": 16}], "link": "https://t.me/cyithr/19667", "regex_matched": true, "is_vacancy": true, "title": "Infrastructure Engineer", "company": null, "location": "Limassol, Cyprus , Office-based", "grade": "Lead", "python": false, "django": false, "fastapi": false, "flask": false, "php": false, "java": false, "go": false, "node": false, "dotnet": false, "ruby": false, "rust": false, "sql": false, "nosql": false, "kafka": false, "docker": false, "microservices": false, "grpc": false, "rest": false, "ml_ai": true, "remote": false, "salary": null, "short_description": "Location: Limassol, Cyprus , Office-based AIP Tech is a leader in algorithmic trading, bringing together experts in quantitative analysis, data science, and advanced coding.", "duplicates": [{"channel_username": "cyithr", "channel_title": "CY IT HR ify and mitigate security risks.\n• Design, implement, and continuously improve the company’s security architecture and technical controls.\n\nRequired Qualifications (Must-Have)\n\n• 3+ years of hands-on experience in Cybersecurity / Information Security.\n• Strong understanding of TCP/IP, DNS, HTTP/HTTPS, TLS, VPN, NAT, and network routing.\n• Solid Linux administration skills.\n• Practical experience configuring Firewalls, WAF, ACLs, and network segmentation.\n• Hands-on experience with Cloudflare or equivalent WAF/CDN/DDoS protection solutions.\n• Good understanding of the OWASP Top 10 and common Web/API attack vectors.\n• Practical experience with Vulnerability Management tools such as Nessus, OpenVAS, Qualys, or equivalents.\n• Knowledge of CVE/CVSS and the ability to assess the actual business and technical risks associated with identified vulnerabilities.\n• Experience with SIEM, IDS/IPS, and centralized log collection.\n• Ability to analyze system, network, application, and web server logs.\n• Experience investigating security incidents and working with Indicators of Compromise (IOCs).\n• Understanding of RBAC, MFA, PAM, the Principle of Least Privilege, and privileged access management.\n• Experience with Docker and an understanding of container security principles.\n• Understanding of SAST, DAST, dependency scanning, and secret scanning.\n• Ability to automate security tasks using Bash and/or Python.\n\nZero Trust — Mandatory Requirements\n\nPractical experience implementing Zero Trust Network Access (ZTNA) solutions and a solid understanding of Zero Trust architecture are essential for this role.\n\nThe candidate should be able to design, implement, and maintain a Zero Trust approach, including:\n\n• Designing and implementing Zero Trust security architecture.\n• Implementing ZTNA for employees’ and administrators’ access to internal infrastructure.\n• Replacing network/IP-based trust with identity-based access controls.\n• Implementing Device Trust and ly with development, sales and operational teams on financial matters and project performance\n- Support the CFO and management in evaluating strategic initiatives, investments and business opportunities\n- Support audit processes, reconciliations and preparation of required financial information and documentation\n- Act as a key point of contact on financial matters in the CFO’s absence\n\nRequirements and Qualifications:\n- 7+ years of relevant experience in financial management, corporate finance, financial controlling or a similar senior finance role\n- Experience managing or coordinating financial processes across multiple companies or business units\n- Strong hands-on experience in cash flow planning, forecasting and liquidity management\n- Strong understanding of P&L, Balance Sheet and Cash Flow\n- Experience in financial modelling, budgeting, forecasting and variance analysis\n- Experience preparing financial and analytical reporting for senior management, investors or business partners\n- Ability to translate complex financial data into clear business insights and recommendations\n- Strong understanding of Cyprus accounting and financial reporting requirements\n- Strong analytical, organisational and problem-solving skills\n- Advanced proficiency in Excel\n- Excellent communication and presentation skills\n- Excellent written and spoken English and Russian are mandatory\n- Degree in Finance, Accounting, Economics, Business Administration or a related field\n- Experience in real estate, construction or engineering businesses would be an advantage\n\nWhat We Offer:\n- Competitive salary based on experience and qualifications\n- Senior role with direct involvement in the Group’s financial management and strategic decision-making\n- Direct collaboration with the CFO, management, investors and business partners\n- Long-term employment with a BCS-certified company\n- 21 days of paid annual leave\n- Extra 5 paid sick days per year\n- Supportive and collaborative team culture\n- Modern office in the centre of Paphos\n- Opportunity to work across diverse business projects and grow together with the business\n \nInterested candidates are requested to send their CV quoting the above job title to hr_cyprus@inex-group.com. or @inexHR", "entities": [], "link": "https://t.me/cyithr/19338", "regex_matched": true, "is_vacancy": true, "title": "DEPUTY CFO", "company": null, "location": null, "grade": "Senior", "python": false, "django": false, "fastapi": false, "flask": false, "php": false, "java": false, "go": false, "node": false, "dotnet": false, "ruby": false, "rust": false, "sql": false, "nosql": false, "kafka": false, "docker": false, "microservices": false, "grpc": false, "rest": false, "ml_ai": false, "remote": false, "salary": null, "short_description": "INEX Group is a real estate development and construction group of companies delivering residential and commercial projects across Cyprus. We manage the full project lifecycle — from land acquisition and design to construction and delivery.", "duplicates": [], "is_new": false, "is_archived": true}, {"channel_id": 1654483967, "channel_username": "cyithr", "channel_title": "CY IT HR Vacancy", "msg_id": 19337, "date_iso": "2026-09-30T14:49:40+00:00", "text": "#vacancy #Paphos #finance\n\nSENIOR KYC & FINANCE OPERATIONS SPECIALIST\nPaphos\n————\nINEX Group is a real estate development and construction group of companies delivering residential and commercial projects across Cyprus.\nWe manage the full project lifecycle — from land acquisition and design to construction and delivery.\nAs our business continues to grow, we are looking for an experienced Senior KYC & Finance Operations Specialist to join our Finance team in Paphos.\nThis role will be responsible for managing KYC and banking-related processes across the Group, working closely with clients, counterparties and financial institutions in Cyprus and internationally. The position also includes monitoring accounts receivable a стратора: сами поднимали серверы, настраивали сеть, DNS, HTTPS.\n▪️Дотошность: докопаться и записать, что нашли. Понятная техдокументация.\n▪️Аккуратность с ИИ: мы им пользуемся, но нужен человек, который проверяет за моделью и понимает каждую строку, которую коммитит.\nПлюсом: понимание VPN/Proxy, базовая ИБ-грамотность.\n\n❌ Не подойдёт: студентам очной формы; тем, кому нужен ментор и жёсткое ревью, чтобы расти; тем, кто отдаёт задачу агенту и присылает результат не читая.\n\n💼 R&D и рост в перспективе: погружение в наши сервисы анализа сетевых протоколов, участие в исследованиях и разработке новых методов детекции в сфере anti-fraud.\n\n \n🤝 Формат: удалёнка, фултайм, самозанятость, РФ или РБ\n\n▪️Зарплата от 70-170 тыс. руб. на руки (возможны выплаты в USDT).\n▪️Задачка на интерес: клиент резолвит имя через Cloudflare DNS, а ответ приходит с адреса Google. Если интересно, почему так, — вам к нам.\n▪️Анкета: [Заполнить анкету]\n\n#вакансия #Go #Golang #backend #remote #работа #job #vacancy #разработчик #fulltime #удаленка", "entities": [{"type": "text_url", "offset": 2096, "length": 18, "url": "https://docs.google.com/forms/d/e/1FAIpQLSe5W392c7iFIrc2euAwaSAu5GciTL6eGllyrOqDcWPMKUrBkg/viewform?usp=pp_url&entry.99068136=fordev"}], "link": "https://t.me/fordev/57395", "regex_matched": true, "is_vacancy": true, "title": "Go Backend Developer (Сети, DevOps, Security)", "company": null, "location": "Remote", "grade": null, "python": false, "django": false, "fastapi": false, "flask": false, "php": false, "java": false, "go": true, "node": false, "dotnet": false, "ruby": false, "rust": false, "sql": false, "nosql": false, "kafka": false, "docker": false, "microservices": false, "grpc": false, "rest": false, "ml_ai": false, "remote": true, "salary": "170 тыс", "short_description": "Мы — технологический стартап, делаем детекцию прокси и VPN по сетевым отпечаткам и DNS-скоринг для антифрода (Не РКН). Разработка своя, продукт продаётся, есть клиенты. Название и сайт покажем
