iness partners\n- Ability to translate complex financial data into clear business insights and recommendations\n- Strong understanding of Cyprus accounting and financial reporting requirements\n- Strong analytical, organisational and problem-solving skills\n- Advanced proficiency in Excel\n- Excellent communication and presentation skills\n- Excellent written and spoken English and Russian are mandatory\n- Degree in Finance, Accounting, Economics, Business Administration or a related field\n- Experience in real estate, construction or engineering businesses would be an advantage\n\nWhat We Offer:\n- Competitive salary based on experience and qualifications\n- Senior role with direct involvement in the Group’s financial management and strategic decision-making\n- Direct collaboration with the CFO, management, investors and business partners\n- Long-term employment with a BCS-certified company\n- 21 days of paid annual leave\n- Extra 5 paid sick days per year\n- Supportive and collaborative team culture\n- Modern office in the centre of Paphos\n- Opportunity to work across diverse business projects and grow together with the business\n \nInterested candidates are requested to send their CV quoting the above job title to hr_cyprus@inex-group.com. or @inexHR", "entities": [], "link": "https://t.me/cyithr/19338", "regex_matched": true, "is_vacancy": true, "title": "DEPUTY CFO", "company": null, "location": null, "grade": "Senior", "python": false, "django": false, "fastapi": false, "flask": false, "php": false, "java": false, "go": false, "node": false, "dotnet": false, "ruby": false, "rust": false, "sql": false, "nosql": false, "kafka": false, "docker": false, "microservices": false, "grpc": false, "rest": false, "ml_ai": false, "remote": false, "salary": null, "short_description": "INEX Group is a real estate development and construction group of companies delivering residential and commercial projects across Cyprus. We manage the full project lifecycle — from land acq ification required\n- Maintain accurate and up-to-date KYC records and supporting documentation\n- Monitor relevant changes in KYC, AML and banking requirements\n- Contribute to the development and improvement of internal KYC processes and documentation standards\n\nRequirements and Qualifications:\n- 5+ years of relevant experience in KYC, AML, banking, financial services or a similar role\n- Hands-on experience in Cyprus and a strong understanding of local banking practices and KYC/AML requirements\n- Practical experience with Source of Funds and Source of Wealth verification\n- Experience with international payments and cross-border transactions\n- Strong understanding of documentation required by banks for KYC and transaction-related purposes\n- Experience working directly with banks, clients and counterparties\n- Ability to manage complex cases independently and coordinate with multiple stakeholders\n- Strong analytical skills and excellent attention to detail\n- Excellent organisational and communication skills\n- Excellent written and spoken English and Russian are mandatory\n- Degree in Finance, Accounting, Economics, Law, Business Administration or a related field\n- Experience in real estate, banking, wealth management, fiduciary services or professional services would be an advantage\n\nWhat We Offer:\n- Competitive salary based on experience and qualifications\n- Long-term employment with a BCS-certified company\n- 21 days of paid annual leave\n- 5 paid sick days\n- Supportive and collaborative team culture\n- Modern office in the centre of Paphos\n- Opportunity to work across diverse business projects and grow together with the business\nInterested candidates are requested to send their CV quoting the above job title to hr_cyprus@inex-group.com. or @inexHR\nAll applications will be treated in strict confidence and in compliance with GDPR and our privacy policy.", "entities": [], "link": "https://t.me/cyithr/19337", "regex_matched": true, "is_vacancy": t аботка своя, продукт продаётся, есть клиенты. Название и сайт покажем на первом созвоне — не хотим, чтобы конкуренты читали нашу вакансию раньше кандидатов.\n \nБэкенд на Go — микросервисы, аутентификация, API-ключи, сборщики данных — и исследования: почему резолвер ответил так, где протекает прокси, что видно по DNS-запросам. Про многое из этого в интернете не написано — придётся ставить стенд и смотреть. Хорошая вакансия для тех, кто пришёл в Golang из сетей или ИБ: профильное образование, первая работа на Go уже была — и хочется наконец применить сети всерьёз. Главное — чтобы горели глаза на безопасность, сети и исследования и хотелось в этом расти. \n \n⚙️ Требования:\n\n▪️Go: год коммерческой разработки (микросервисы с аутентификацией, парсинг данных, Docker/compose);\n▪️Сети всерьёз: модель OSI, DNS, как работает резолвинг, TCP/UDP. Подтверждение — либо профильное образование очно (ИБ, телеком), либо опыт. (На созвоне попросим рассказать путь запроса по уровням OSI.)\n▪️Linux на уровне администратора: сами поднимали серверы, настраивали сеть, DNS, HTTPS.\n▪️Дотошность: докопаться и записать, что нашли. Понятная техдокументация.\n▪️Аккуратность с ИИ: мы им пользуемся, но нужен человек, который проверяет за моделью и понимает каждую строку, которую коммитит.\nПлюсом: понимание VPN/Proxy, базовая ИБ-грамотность.\n\n❌ Не подойдёт: студентам очной формы; тем, кому нужен ментор и жёсткое ревью, чтобы расти; тем, кто отдаёт задачу агенту и присылает результат не читая.\n\n💼 R&D и рост в перспективе: погружение в наши сервисы анализа сетевых протоколов, участие в исследованиях и разработке новых методов детекции в сфере anti-fraud.\n\n \n🤝 Формат: удалёнка, фултайм, самозанятость, РФ или РБ\n\n▪️Зарплата от 70-170 тыс. руб. на руки (возможны выплаты в USDT).\n▪️Задачка на интерес: клиент резолвит имя через Cloudflare DNS, а ответ приходит с адреса Google. Если интересно, почему так, — вам к нам.\n▪️Анкета: [Заполнить анкету]\n\n#вакансия #Go #Golang #backend #remote #работа #job #vacancy #разработчик #fulltime #удаленка", "entities": [{"type": "text_url", "offset": 2096, "length": 18, "url": "https://docs.google.com/forms/d/e/1FAIpQLSe5W392c7iFIrc2euAwaSAu5GciTL6eGllyrOqDcWPMKUrBkg/viewform?usp=pp_url&entry.99068136=fordev"}], "link": "https://t.me/fordev/57395", "regex_matched": true, "is_vacancy": true, "title": "Go Backend Developer (Сети, DevOps, Security)", "company": null, "location": "Remote", "grade": null, "python": false, "django": false, "fastapi": false, "flask": false, "php": false, "java": false, "go": true, "node": false, "dotnet": false, "ruby": false, "rust": false, "sql": false, "nosql": false, "kafka": false, "docker": false, "microservices": false, "grpc": false, "rest": false, "ml_ai": false, "remote": true, "salary": "170 тыс", "short_description": "Мы — технологический стартап, делаем детекцию прокси и VPN по сетевым отпечаткам и DNS-скоринг для антифрода (Не РКН). Разработка своя, продукт продаётся, есть клиенты. Название и сайт покажем на первом созвоне — не хотим, чтобы конкуренты читали нашу вакансию раньше кандидатов.", "duplicates": [], "is_new": false, "is_archived": false}, {"channel_id": 1305766523, "channel_username": "pythonrabota", "channel_title": "Python работа", "msg_id": 2356, "date_iso": "2026-09-28T15:50:12+00:00", "text": "Python Developer\n\nФормат: удалённо\nКомпания: ITK academy\nЗП: от 75 тыс руб\nПолная занятость\n\n#remote #junior #fulltime\n\nОткликнуться: https://talanto.work/jobs/9e2054dc-ab3b-4774-a97a-a2223e0650d4\n\nА перед отправкой резюме - проверьте его на ATS совместимость на updatecv.me", "entities": [{"type": "text_url", "offset": 134, "length": 62, "url": "https://talanto.work/jobs/9e2054dc-ab3b-4774-a97a-a2223e0650d4"}, {"type": "text_url", "offset": 263, "length": 11, "url": "https://updatecv.me/?utm_source=tgbtm"}], "link": "https://t.me/pythonrabota/2356", "regex_matched": true, "is_vacancy": true, "title": "Python Developer", "company": "ITK academy", "location":
